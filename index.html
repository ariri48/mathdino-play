<style>
:root{--bg:#fff6e9;--ink:#3b2f2a;--soft:#7a6b62;--card:#fff;--accent:#5b3fa8;--sun:#ffc83d;
  --disp:"Jua","Apple SD Gothic Neo",sans-serif;--body:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);background-image:radial-gradient(circle at 12px 12px,#ffe2b8 3px,transparent 3.5px),radial-gradient(circle at 36px 36px,#d8f0e4 3px,transparent 3.5px);background-size:48px 48px;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:1100px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 40px}
.sky{position:relative;border-radius:36px;background:linear-gradient(#bfe6ff,#e8f7ff 70%);padding:26px 26px 90px;overflow:hidden}
.sky::after{content:"";position:absolute;left:-5%;right:-5%;bottom:-60px;height:140px;background:#9ddca8;border-radius:50% 50% 0 0 / 100% 100% 0 0;box-shadow:0 -14px 0 #c3ecc9}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.95}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:120px;height:38px;right:8%;top:22px}.c1::before{width:56px;height:56px;left:16px;top:-26px}.c1::after{width:40px;height:40px;left:62px;top:-16px}
.c2{width:90px;height:30px;left:46%;top:70px;opacity:.8}.c2::before{width:42px;height:42px;left:12px;top:-20px}.c2::after{width:30px;height:30px;left:46px;top:-12px}
h1{position:relative;z-index:1;font-family:var(--disp);font-weight:400;font-size:clamp(36px,7vw,64px);margin:0;color:var(--accent);text-shadow:0 4px 0 #fff}
.hello{position:relative;z-index:2;display:flex;align-items:flex-end;gap:12px;margin-top:10px}
.bud{width:130px;height:156px;flex:none;line-height:0}
.say{position:relative;background:#fff;border-radius:26px;padding:14px 20px;font-family:var(--disp);font-size:clamp(20px,3.2vw,30px);margin-bottom:34px;box-shadow:0 6px 0 rgba(59,47,42,.08);text-wrap:balance}
.say::before{content:"";position:absolute;left:-14px;bottom:20px;border:10px solid transparent;border-right:16px solid #fff;border-left:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:-50px;position:relative;z-index:3}
.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:#fff;border-radius:32px;padding:20px;box-shadow:0 8px 0 var(--sh);border:5px solid var(--c);transition:transform .12s}
.card:active{transform:translateY(6px);box-shadow:0 2px 0 var(--sh)}
.art{height:150px;border-radius:24px;background:var(--tint);display:flex;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden}
.art svg{width:96px;height:96px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.08))}
.art .big{width:120px;height:120px;animation:bob 2.4s ease-in-out infinite}
.art .sm{width:64px;height:64px;animation:bob 2.4s ease-in-out infinite .4s}
.letters{font-family:var(--disp);font-size:44px;color:var(--c);display:flex;gap:10px}
.letters span{background:#fff;border-radius:18px;padding:4px 14px;box-shadow:0 4px 0 rgba(0,0,0,.08);animation:bob 2.4s ease-in-out infinite}
.letters span:nth-child(2){animation-delay:.3s}.letters span:nth-child(3){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-8px)}}
.card h2{font-family:var(--disp);font-weight:400;font-size:32px;margin:6px 0 0;color:var(--c)}
.card p{margin:0;font-size:17px;color:var(--soft);word-break:keep-all}
.prog{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:18px}
.bar{flex:1;height:14px;border-radius:999px;background:#f1ece7;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);border-radius:999px}
.say,.card p{word-break:keep-all;overflow-wrap:anywhere}
.foot{font-size:13px;color:var(--soft);text-align:center;margin-top:26px;word-break:keep-all}
@media (max-width:520px){
  .sky{padding:20px 18px 66px;border-radius:28px}
  .bud{width:96px;height:115px}
  .say{margin-bottom:18px;padding:10px 14px}
  .cards{margin-top:-36px;gap:14px}
  .card{padding:14px 16px;border-radius:26px}
  .art{height:108px}.art .big{width:88px;height:88px}.art .sm{width:52px;height:52px}
  .card h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* 캐릭터 */
[data-buddy]{display:inline-block;line-height:0}
.av{width:100%;height:100%;overflow:visible}
.av .fx>g{opacity:0;transition:opacity .2s}
.av .jumper,.av .head,.av .armL,.av .armR,.av .whole,.av .tail{transform-box:view-box;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.av .jumper{transform-origin:100px 230px;animation:breathe 2.6s ease-in-out infinite}
.av .head{transform-origin:100px 130px}
.av .armL{transform-origin:62px 150px}.av .armR{transform-origin:138px 150px}
.av.talk .head{animation:bob .32s ease-in-out infinite alternate}
.av.talk .jumper{animation:bob2 .32s ease-in-out infinite alternate}
.av.pose-cheer .jumper,.av.pose-crown .jumper{animation:jump .55s ease-in-out 3}
.av.pose-cheer .armL{transform:rotate(115deg)}
.av.pose-cheer .armR{transform:rotate(-115deg)}
.av.pose-crown .armR{transform:rotate(-150deg)}.av.pose-crown .armL{transform:rotate(-25deg)}
.av.pose-crown .head{transform:rotate(-6deg)}
.av.pose-cheer .sparkle,.av.pose-crown .sparkle,.av.pose-crown .crown{opacity:1}
.av.pose-crown .sparkle{animation:twinkle .6s ease-in-out infinite alternate}
.av.pose-dizzy .jumper{animation:wobble .5s ease-in-out 3}
.av.pose-dizzy .sweat,.av.pose-dizzy .dizzy{opacity:1}
.av.pose-dizzy .armL{transform:rotate(60deg)}.av.pose-dizzy .armR{transform:rotate(-60deg)}
.av.pose-sad .head{transform:rotate(-12deg) translateY(4px)}
.av.pose-sad .jumper{animation:none;transform:scaleY(.95)}
.av.pose-sad .tears{opacity:1}
.av.pose-sad .armL{transform:rotate(-15deg)}.av.pose-sad .armR{transform:rotate(15deg)}
.av.pose-think .armR{transform:rotate(-140deg)}.av.pose-think .head{transform:rotate(8deg)}
@keyframes breathe{50%{transform:scale(1.02,.98)}}
@keyframes bob{to{transform:rotate(-4deg) translateY(-3px)}}
@keyframes bob2{to{transform:translateY(-4px) scale(1.02,.98)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-34px) scale(.96,1.05)}60%{transform:translateY(0) scale(1.06,.92)}}
@keyframes wobble{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes twinkle{to{opacity:.4}}

.pbud{width:64px;height:76px;flex:none;margin:-6px 0}
.prompt>span:last-child{flex:1;min-width:0;position:relative}

.dbud{width:180px;height:216px}
.kid{position:relative}
.kav{position:absolute;right:12px;top:10px;width:70px;height:84px}
.kpick{padding-right:84px}
.kvk{margin:2px 0 8px}
.krow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.krow .kdel{margin-left:auto}
.aved{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:20px;align-items:start}

.avside{background:var(--card);border-radius:26px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:10px}
.avbig{width:220px;height:264px}
.avform{background:var(--card);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{font-size:20px;background:var(--bg);border-radius:999px;padding:10px 18px}.seg button.on{background:var(--accent);color:#fff}

.suits{display:flex;gap:10px;flex-wrap:wrap}.suit{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 4px #fff,0 0 0 2px #cfc6be}.suit.on{box-shadow:inset 0 0 0 4px #fff,0 0 0 5px var(--ink)}
.vpick{margin-top:16px}.vpick summary{font-family:var(--disp);font-size:20px;cursor:pointer}.vpick select{font-family:var(--disp);font-size:20px;border:3px solid #d9cff5;border-radius:14px;padding:8px 12px;background:#fff;color:var(--ink);max-width:100%}
.vrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.vrow .ghostbtn{margin-left:0;background:var(--bg)}
.row.left{justify-content:flex-start;align-items:center}

.dk{margin:0;font-size:17px;color:var(--soft)}

.dlist b{font-family:var(--disp);font-weight:400;font-size:15px;border-radius:999px;padding:2px 10px;flex:none}
.dlist .ok b{background:#d8f5e5;color:#1f7a4e}.dlist .next b{background:#eee8f8;color:#5b3fa8}.dlist .try b{background:#fff1c2;color:#8a6500}
