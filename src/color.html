<meta charset="utf-8">
<title>색칠 종이</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2f2a;--soft:#7a6b62;--accent:#5b3fa8;--sun:#ffc83d;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff6e9;color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
h1{font-family:"Jua",sans-serif;font-weight:400;font-size:clamp(30px,6vw,48px);color:var(--accent);margin:0 0 6px}
p{font-size:17px;word-break:keep-all}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 16px}
button,a.b{font-family:"Jua",sans-serif;font-size:20px;border:0;border-radius:999px;padding:10px 20px;min-height:46px;background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.08)}
button.main{background:var(--sun);box-shadow:0 4px 0 #d9a21a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.c{background:#fff;border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border:4px solid transparent;font-family:"Jua",sans-serif;font-size:18px}
.c img{width:100%;aspect-ratio:1;object-fit:contain}
.c input{position:absolute;opacity:0}
.c:has(input:checked){border-color:var(--sun);background:#fffbe9}
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}.wrap{display:none}#print{display:block}
  .pg{page-break-after:always;height:270mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
  .pg:last-child{page-break-after:auto}
  .pg .top{width:100%;display:flex;justify-content:space-between;font-family:"Jua",sans-serif;font-size:16pt}
  .pg img{width:165mm;height:165mm;object-fit:contain}
  .pg .nm{font-family:"Jua",sans-serif;font-size:30pt}
  .pg .tip{font-size:11pt;color:#555;text-align:center}
}
</style>
<div class="wrap">
  <h1>색칠 종이</h1>
  <p>색칠할 그림을 골라 인쇄해요. 한 장에 그림 하나가 크게 나와요. 색칠한 뒤 놀이터의 <b>"색칠 그림 넣기"</b>에서 사진을 찍으면 그 그림이 놀이에 나와요.</p>
  <div class="bar"><button class="main" id="go" type="button">고른 그림 인쇄하기</button><button id="all" type="button">모두 고르기</button><button id="none" type="button">모두 풀기</button><a class="b" href="./">← 놀이터</a></div>
  <div class="grid">{{CELLS}}</div>
</div>
<div id="print"></div>
<script>
(function(){ var q=new URLSearchParams(location.search).get("k"), boxes=[].slice.call(document.querySelectorAll(".c input"));
  if(q) boxes.forEach(function(b){ if(b.value===q) b.checked=true; });
  document.getElementById("all").onclick=function(){ boxes.forEach(function(b){ b.checked=true; }); };
  document.getElementById("none").onclick=function(){ boxes.forEach(function(b){ b.checked=false; }); };
  document.getElementById("go").onclick=function(){ var sel=boxes.filter(function(b){ return b.checked; }); if(!sel.length){ alert("인쇄할 그림을 골라 주세요."); return; }
    var nm=""; try{ var o=JSON.parse(localStorage.getItem("mathdino-play-v2"))||{}; var k=(o.kids||[]).filter(function(x){ return x.id===o.cur; })[0]; nm=k?k.name:""; }catch(e){}
    document.getElementById("print").innerHTML=sel.map(function(b){ var lab=b.parentNode.querySelector("span").textContent;
      return '<div class="pg"><div class="top"><span>이름: '+(nm?nm.replace(/[<>&]/g,""):"________")+'</span><span>날짜: ____월 ____일</span></div><img src="art/line/'+b.value+'.png" alt=""><div class="nm">'+lab+'</div><div class="tip">다 칠하면 놀이터의 "색칠 그림 넣기"에서 사진을 찍어요. 선 밖은 하얗게 두면 더 예쁘게 나와요.</div></div>'; }).join("");
    var imgs=[].slice.call(document.querySelectorAll("#print img")), n=0; if(!imgs.length) return;
    imgs.forEach(function(im){ if(im.complete){ if(++n===imgs.length) print(); } else im.onload=im.onerror=function(){ if(++n===imgs.length) print(); }; }); }; })();
</script>
